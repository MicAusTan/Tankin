<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tank Arena</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
body{margin:0;background:#12151c;color:#e8ecf3;font:15px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{margin:18px 0 8px}
.scr{width:min(960px,96vw)}
.card{background:#1c212c;border-radius:12px;padding:16px;margin:10px 0}
input,button,select{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #394155;background:#262d3b;color:inherit}
button{cursor:pointer;background:#3b6df0;border:0}button.alt{background:#394155}
button:disabled{opacity:.4;cursor:default}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
canvas{width:100%;border-radius:12px;background:#000;touch-action:none;display:block}
.bar{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
small{color:#8d97ad}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:6px 0 14px}
.tc{background:#1c212c;border-radius:8px;padding:8px 10px;cursor:pointer;border:2px solid transparent}
.tc.on{border-color:#3b6df0}
.sw{width:26px;height:26px;padding:0;border-radius:50%;margin-right:4px}
.pc{background:#262d3b;border-radius:10px;padding:10px;margin:10px 0}
.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pts{margin-left:auto;font-weight:700}.pts.full{color:#f87171}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.wc{background:#1c212c;border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.wc.on{outline:2px solid #3b6df0}.wc button{padding:1px 9px}
.st{display:flex;gap:6px;align-items:center}
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#1c212c;border-radius:999px;padding:2px 10px;font-size:13px}
.prow{margin:10px 0;line-height:2.3}
</style></head><body>
<h1>Tank Arena</h1>

<div class="scr" id="menu">
 <div class="card">
  <div class="bar"><input id="name" placeholder="Your name" maxlength="14" value="Player">
  <button id="host">Host a lobby</button></div>
  <div class="bar"><span>Tank:</span><span id="swatches"></span><select id="hatsel"></select></div>
  <div class="bar"><input id="joincode" placeholder="Lobby code" maxlength="5" style="text-transform:uppercase">
  <button id="join">Join</button></div>
  <p id="status"><small>Host a lobby and share the code, or enter a friend's code.</small></p>
 </div>
</div>

<div class="scr" id="lobbyscr" hidden>
 <div class="card">
  <div>Lobby code: <b id="code" style="font-size:22px;letter-spacing:3px"></b> <button class="alt" id="copylink">Copy invite link</button></div>
  <div id="plist" style="margin:12px 0;line-height:1.8"></div>
  <div class="bar" id="hostbtns">
   <button class="alt" id="addlocal">+ Local player</button>
   <button class="alt" id="addbot">+ Bot</button><button class="alt" id="rmlast">Remove last</button>
   <button class="alt" id="resetsc">Reset scores</button>
   <select id="modesel"></select>
   <select id="mapsel"></select><select id="szsel"></select><select id="budsel"></select><select id="hpsel"></select><select id="trsel"></select><select id="drawsel"></select><select id="traitsel"></select>
   <button id="start">Start game</button>
  </div>
  <small id="waitmsg"></small>
 </div>
</div>

<div class="scr" id="draftscr" hidden>
 <div class="card"><h3 style="margin-top:0">Pick your trait</h3><div id="dlist"></div>
 <div class="bar"><button class="alt" id="dauto">Auto-pick the rest</button><button class="alt" id="dcancel">Back to lobby</button></div></div>
</div>

<div class="scr" id="gamescr" hidden>
 <canvas id="cv" width="960" height="540"></canvas>
 <div class="bar" id="wbar"></div>
 <div class="bar">
  <button class="alt" id="mute">🔊</button><button class="alt" id="zin">＋</button><button class="alt" id="zout">－</button><button class="alt" id="zfit">Fit</button><button class="alt" id="mvl">◀</button><button class="alt" id="mvr">▶</button>
  <button id="fire">Fire!</button>
  <small>Drag to aim, or ←/→ angle, ↑/↓ power, 1-9 or Q/E weapon, A/D or ◀▶ move, Space to fire. Wheel = zoom, right-drag = pan.</small>
  <button class="alt" id="newgame" hidden>Back to lobby</button>
 </div>
</div>

<script>
let W=960;
const H=540,COL=['#ef4444','#3b82f6','#22c55e','#eab308'];
const WEAPONS=[
 {d:'Standard shell. Unlimited.',name:'Shell',r:40,dmg:35,cost:0,tags:['shell']},
 {d:'Large blast, heavy damage.',name:'Big Bomb',r:65,dmg:55,cost:3,tags:['explosive']},
 {d:'Splits into 3 shells at the top of its arc.',name:'Splitter',r:28,dmg:22,cost:2,split:1,tags:['explosive','cluster']},
 {d:'Explodes on landing and again on each of 2 bounces.',name:'Bouncer',r:34,dmg:30,cost:2,bounce:2,tags:['bounce']},
 {d:'Marks a spot, then 3 bombs drop from the sky around it.',name:'Airstrike',r:30,dmg:22,cost:3,strike:1,tags:['explosive','air']},
 {d:'Piles up terrain where it lands. Build cover or fill pits.',name:'Dirt Ball',r:65,dmg:0,cost:1,add:1,tags:['earth']},
 {d:'Heals every tank near the impact (enemies too!).',name:'Repair Shell',kind:'heal',r:50,dmg:0,heal:75,cost:2,tags:['support']},
 {d:'Tanks near the impact take 60% less damage until their next turn.',name:'Shield Shell',kind:'shield',r:60,dmg:0,cost:2,tags:['support']},
 {d:'You teleport to where it lands.',name:'Teleport Shell',kind:'tele',r:20,dmg:0,cost:2,tags:['support']},
 {d:'Enormous blast, the heaviest single hit in the game.',name:'Nuke',r:100,dmg:75,cost:6,tags:['explosive']},
 {d:'Fires 3 shells in a small fan.',name:'Triple Shot',r:28,dmg:22,cost:3,multi:1,tags:['multi']},
 {d:'Rolls along the ground after landing, exploding on contact or at a steep slope.',name:'Roller',r:38,dmg:40,cost:2,roll:1,tags:['rolling']},
 {d:'You heal for 60% of the damage you deal.',name:'Vampire Shell',r:35,dmg:38,cost:3,vamp:1,tags:['vampire']},
 {d:'Splits into 5 small bomblets at the top of its arc.',name:'Cluster Bomb',r:22,dmg:18,cost:3,split:1,kids:5,tags:['explosive','cluster']},
 {d:'Flies perfectly straight: no arc, no wind, fixed speed. Pierces thin terrain.',name:'Sniper Shell',r:14,dmg:60,cost:2,nowind:1,straight:1,pierce:30,tags:['precision']},
 {d:'Poisons tanks in the cloud: 8 damage per turn for 3 turns.',name:'Poison Shell',r:34,dmg:15,cost:2,psn:1,tags:['poison']},
 {d:'Bores through terrain in a straight line, slowly. Explodes when it breaks out the far side, hits a tank, or runs out of drill.',name:'Drill',r:45,dmg:50,cost:3,drill:170,tags:['drill']}
];
/* Traits: global (hp,fuel,gdmg,armor) and/or weapon-tag based (tag + dmg/r/free) */
const TRAITS=[
 {name:'None',d:'no bonus'},
 {name:'Tough',hp:50,d:'+50 HP'},
 {name:'Glass Cannon',hp:-30,gdmg:1.25,d:'-30 HP, +25% damage'},
 {name:'Mobile',fuel:1.8,d:'80% more fuel'},
 {name:'Armored',armor:0.8,d:'-20% damage taken'},
 {name:'Survivor',regen:15,d:'heal 15 HP each turn'},
 {name:'Heavy Hitter',gdmg:1.15,d:'+15% damage, all weapons'},
 {name:'Demolitionist',tag:'explosive',r:1.2,dmg:1.3,d:'explosives +30% dmg, +20% radius'},
 {name:'Bounce Master',tag:'bounce',dmg:1.5,free:1,d:'bouncers +50% dmg, +1 free'},
 {name:'Medic',tag:'support',dmg:1.5,free:1,d:'support +50% power, +1 free'},
 {name:'Sapper',tag:'earth',r:1.5,free:2,d:'dirt +50% size, +2 free'},
 {name:'Gunner',tag:'multi',dmg:1.4,free:2,d:'triple shots +40% dmg, +2 free'},
 {name:'Bowler',tag:'rolling',dmg:1.5,free:1,d:'rollers +50% dmg, +1 free'},
 {name:'Marksman',tag:'precision',dmg:1.35,free:1,d:'sniper +35% dmg, +1 free'},
 {name:'Toxicologist',tag:'poison',dmg:1.6,r:1.3,free:1,d:'poison +60% dmg, bigger cloud, +1 free'},
 {name:'Vampire Lord',tag:'vampire',dmg:1.4,free:1,d:'vampire shells +40% dmg, +1 free'},
 {name:'Climber',climb:9,d:'walk up much steeper slopes'},
 {name:'Double Tap',twin:1,d:'after each shot, a bonus Shell shot (60% damage)'},
 {name:'Wild Cannon',jit:1,gdmg:1.3,d:'+30% damage, but your shots wobble'},
 {name:'Burrower',pierce:28,d:'your shells tunnel through ~28px of terrain'},
 {name:'Berserker',berserk:.5,d:'+50% damage while below half HP'},
 {name:'Escalation',grow:.06,d:'blast radius +6% per turn survived (max +50%)'},
 {name:'Miner',tag:'drill',dmg:1.4,r:1.2,free:1,d:'drills +40% dmg, bigger blast, +1 free'}
];
const KC={heal:'#4ade80',shield:'#60a5fa',tele:'#c084fc'};
const TN=['Red','Blue'];
const TERN=['Static','Rising ground','Sinking ground','Quakes','Chaos (random each round)'];
const PAL=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#14b8a6','#ec4899'];
const HATS=['No hat','Cap','Crown','Horns','Antenna'];
function fixColors(){const u=new Set();lobby.forEach(e=>{if(e.col==null||u.has(e.col)){let c=0;while(u.has(c))c++;e.col=c}u.add(e.col)})}
function drawHat(c,x,y,h){
  c.save();c.translate(x,y);
  if(h===1){c.fillStyle='#222';c.fillRect(-8,-4,16,3);c.fillRect(-5,-11,10,8)}
  else if(h===2){c.fillStyle='#facc15';c.beginPath();c.moveTo(-8,0);c.lineTo(-8,-10);c.lineTo(-4,-5);c.lineTo(0,-12);c.lineTo(4,-5);c.lineTo(8,-10);c.lineTo(8,0);c.fill()}
  else if(h===3){c.strokeStyle='#e5e7eb';c.lineWidth=3;c.beginPath();c.moveTo(-6,-4);c.quadraticCurveTo(-12,-8,-9,-14);c.moveTo(6,-4);c.quadraticCurveTo(12,-8,9,-14);c.stroke()}
  else if(h===4){c.strokeStyle='#9ca3af';c.lineWidth=2;c.beginPath();c.moveTo(0,-4);c.lineTo(0,-15);c.stroke();c.fillStyle='#ef4444';c.beginPath();c.arc(0,-16,3,0,7);c.fill()}
  c.restore();
}
const HANDMAX=4;
const MAPS=['Hills','Flat','Canyon','Mountains','Death Pits','Twin Peaks','Staircase','Bowl','Archipelago','Dunes','Great Wall'];
const tmatch=(p,w)=>{const t=TRAITS[p.trait];return t.tag&&w.tags.includes(t.tag)?t:{}};
let budget=10;
const FUEL=100,MAXAMMO=5,MAXHIT=90;
const SIZES=[['Small',960],['Medium',1400],['Large',1900]];
const mk=(name,owner)=>{const e={name,owner,trait:0,load:WEAPONS.map((w,i)=>i&&i<4?1:0)};trimLoad(e.load);return e};
function trimLoad(l){
  while(cost(l)>budget){let b=-1;l.forEach((n,i)=>{if(n>0&&(b<0||WEAPONS[i].cost>=WEAPONS[b].cost))b=i});if(b<0)break;l[b]--}
}
const cost=l=>l.reduce((a,n,i)=>a+n*(WEAPONS[i].cost||0),0);
let hpMul=1;
const hpOf=p=>Math.round((150+(TRAITS[p.trait].hp||0))*hpMul);
const fuelOf=p=>Math.round(FUEL*(TRAITS[p.trait].fuel||1));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=id=>document.querySelectorAll('.scr').forEach(e=>e.hidden=e.id!==id);

let peer,conns=[],hostConn=null,isHost=false,myId='host',code='',lobby=[],G=null,mapStyle=-1,teamMode=false,mapW=960,hpSet=1,terMode=0,drawVal=0,traitMode=0,draft=null,draftData=null;

/* ---------- terrain ---------- */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genTerrain(seed,st){
  const r=rng(seed),ys=new Float32Array(W),f=[];
  const nf=st===3?6:st===1?2:4,fk=Math.max(1,W/1100);
  for(let i=0;i<nf;i++)f.push([r()*6.28,1+i*(st===3?2.2:1.7)+r(),(st===3?110:st===1?10:70)/(i+1)]);
  const c=W*(.35+r()*.3),pits=[.15+r()*.2,.45+r()*.1,.75+r()*.15].map(v=>v*W);
  const isl=Array.from({length:5},()=>230+r()*170),flip=f[0][0]>3.14;
  for(let x=0;x<W;x++){
    const u=x/W;
    let y=H*(st===1?.72:.6),pit=false;
    for(const[p,k,a]of f)y+=Math.sin(x/W*6.28*k*fk+p)*a;
    if(st===2)y=H*.45+(y-H*.6)*.5+200*Math.exp(-(((x-c)/(120*W/960))**2));
    if(st===4){y=H*.55+(y-H*.6)*.4;for(const q of pits)if(Math.abs(x-q)<38)pit=true}
    const g=(c0,w0)=>Math.exp(-(((u-c0)/w0)**2));
    if(st===5)y=H*.78+(y-H*.6)*.3-270*(g(.27,.1)+g(.73,.1));
    if(st===6){const uu=flip?1-u:u;y=150+Math.floor(uu*6)*52+(y-H*.6)*.08}
    if(st===7)y=160+(y-H*.6)*.25+250*g(.5,.22);
    if(st===8){const sw=W/5,m=x%sw,id=Math.min(4,Math.floor(x/sw));y=isl[id]+(y-H*.6)*.15;pit=(m<26&&id>0)||(m>sw-26&&id<4)}
    if(st===9)y=H*.62+(y-H*.6)*.35+28*Math.sin(u*6.28*9*fk+f[0][0])+16*Math.sin(u*6.28*17*fk+f[1][0]);
    if(st===10)y=H*.72+(y-H*.6)*.25-320*Math.exp(-(((u-.5)/.04)**4));
    ys[x]=pit?H:Math.max(st===3||st===5||st===10?100:150,Math.min(H-60,y));
  }
  return ys;
}
function platform(ys,x){const l=Math.min(ys[x],H-80);for(let i=x-20;i<=x+20;i++)ys[i]=l}
function applyTerrain(ys,t){
  for(let x=0;x<W;x++){
    if(ys[x]>=H-1)continue;
    const d=t.m===1?-14:t.m===2?14:Math.round(Math.sin(x*.025+t.ph)*16);
    ys[x]=Math.max(90,Math.min(H,ys[x]+d));
  }
}
function bump(ys,cx,cy,r){
  for(let x=Math.max(0,Math.floor(cx-r));x<=Math.min(W-1,Math.ceil(cx+r));x++){
    const d=r*r-(x-cx)*(x-cx);if(d<0)continue;
    const top=cy-Math.sqrt(d);if(top<ys[x])ys[x]=Math.max(40,top);
  }
}
function carve(ys,cx,cy,r){
  for(let x=Math.max(0,Math.floor(cx-r));x<=Math.min(W-1,Math.ceil(cx+r));x++){
    const d=r*r-(x-cx)*(x-cx);if(d<0)continue;
    const dy=Math.sqrt(d);
    if(cy+dy>ys[x]&&cy-dy<=ys[x])ys[x]=Math.min(H,cy+dy);
  }
}

/* ---------- game state ---------- */
function startGame(m){
  W=m.W||960;cam={z:Math.max(960/W,.8),x:W/2,y:H/2,hold:0};hpMul=m.hpm||1;
  G={ys:genTerrain(m.seed,m.map),pl:m.players.map((p,i)=>({...p,team:m.tm?i%2:i,maxhp:hpOf(p),hp:hpOf(p),ammo:m.dm?WEAPONS.map((w,i)=>i?0:-1):p.load.map((n,i)=>i?n+(tmatch(p,WEAPONS[i]).free||0):-1)})),turn:m.turn,wind:m.wind,
     angle:0,power:50,weapon:0,tm:m.tm,dm:m.dm,anim:null,fx:[],floats:[],msgs:[],over:-1,wait:false};
  G.pl.forEach(p=>{while(G.ys[p.x]>=H-1&&p.x<W-30)p.x+=10;platform(G.ys,p.x)});setAim();show('gamescr');$('newgame').hidden=!isHost;
}
function setAim(){
  const p=G.pl[G.turn];
  G.angle=p.la??(p.x<W/2?55:125);G.power=p.lp??50;G.weapon=(p.lw!=null&&p.ammo[p.lw]!==0)?p.lw:0;if(G.bonus)G.weapon=0;
  G.fuel=fuelOf(p);G.sx=p.x;G.t0=performance.now();cam.hold=0;renderW();
}
function clampCam(){
  const z=cam.z,hw=480/z,hh=270/z;
  cam.x=W*z<=960?W/2:Math.min(W-hw,Math.max(hw,cam.x));
  cam.y=Math.min(H-hh,Math.max(-200+hh,cam.y));
}
function camUpdate(){
  let tx=null,ty=null;
  if(performance.now()>cam.hold){
    if(G.anim){const P=G.anim.m.paths[0];if(P&&P.length){const k=Math.min(Math.floor(G.anim.i),P.length-1);tx=P[k][0];ty=P[k][1]}}
    else if(G.over===-1){const p=G.pl[G.turn];tx=p.x;ty=G.ys[p.x]-60}
  }
  if(tx!=null){cam.x+=(tx-cam.x)*.1;cam.y+=(ty-cam.y)*.1}
  clampCam();
}
function zoomAt(cx,cy,f){
  if(!G)return;
  const r=cv.getBoundingClientRect(),mx=(cx-r.left)*960/r.width,my=(cy-r.top)*540/r.height;
  const wx=cam.x+(mx-480)/cam.z,wy=cam.y+(my-270)/cam.z;
  cam.z=Math.min(3,Math.max(960/W,cam.z*f));
  cam.x=wx-(mx-480)/cam.z;cam.y=wy-(my-270)/cam.z;
  cam.hold=performance.now()+4000;clampCam();
}
function sendAim(){const p=G.pl[G.turn],m={t:'aim',x:p.x,a:G.angle,pw:G.power,w:G.weapon};if(isHost)broadcast(m);else hostConn.send(m)}
function applyAim(d){
  if(!G||G.anim||G.pl[G.turn].owner===myId)return;
  const p=G.pl[G.turn],fm=fuelOf(p);
  p.x=Math.min(W-10,Math.max(10,Math.min(G.sx+fm,Math.max(G.sx-fm,Math.round(d.x)))));
  G.angle=+d.a;G.power=+d.pw;if(WEAPONS[d.w])G.weapon=d.w;
}
function cycleW(d){const n=WEAPONS.length;for(let k=1;k<=n;k++){const j=(G.weapon+d*k+n*n)%n;if(G.pl[G.turn].ammo[j]!==0){pickW(j);return}}}
const TURN_MS=60000;
let cam={z:1,x:480,y:270,hold:0};
let AC=null,muted=false;
function sfx(k){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,g=AC.createGain();g.connect(AC.destination);
    if(k==='boom'){
      const b=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
      const s=AC.createBufferSource(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=600;
      s.buffer=b;s.connect(f);f.connect(g);g.gain.value=.7;s.start(t);
    }else{
      const o=AC.createOscillator(),sw={fire:[700,200,.25],heal:[400,900,.3],turn:[500,500,.12]}[k]||[400,400,.1];
      o.type=k==='fire'?'sawtooth':'sine';o.connect(g);
      o.frequency.setValueAtTime(sw[0],t);o.frequency.exponentialRampToValueAtTime(sw[1],t+sw[2]);
      g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+sw[2]);
      o.start(t);o.stop(t+sw[2]+.02);
    }
  }catch(e){}
}
function randLoad(){
  const l=WEAPONS.map(()=>0);
  for(let k=0;k<40;k++){const j=1+(Math.random()*(WEAPONS.length-1)|0);l[j]++;
    if(cost(l)>budget||l[j]>MAXAMMO||(drawVal>0&&WEAPONS[j].cost>=5&&l[j]>1))l[j]--}
  return l;
}
function botTurn(){
  const p=G.pl[G.turn],i0=G.turn;
  const foes=G.pl.filter((q,i)=>q.hp>0&&i!==i0&&(!G.tm||q.team!==p.team));
  if(!foes.length){hostSkip();return}
  const tgt=foes.reduce((a,b)=>Math.abs(a.x-p.x)<Math.abs(b.x-p.x)?a:b);
  const have=p.ammo.map((n,j)=>n!==0?j:-1).filter(j=>j>=0);
  const heal=have.find(j=>WEAPONS[j].kind==='heal');
  const atk=have.filter(j=>!WEAPONS[j].kind&&!WEAPONS[j].add);
  const selfHeal=heal!=null&&p.hp<p.maxhp*.5&&Math.random()<.7;
  const wi=G.bonus?0:selfHeal?heal:atk[Math.random()*atk.length|0];
  if(Math.random()<.5){
    const dir=Math.random()<.5?-1:1;let n=Math.floor(Math.random()*fuelOf(p)*.4);
    while(n-->0){const nx=p.x+dir;if(nx<10||nx>W-10||G.ys[p.x]-G.ys[nx]>3||G.ys[nx]>=H-1)break;p.x=nx}
  }
  const base=WEAPONS[wi],t=tmatch(p,base),tr=TRAITS[p.trait];

        if(k%3===2)mids.push({k:path.length-1,b:{x:Math.round(x),y:Math.round(y),r:15,dmg:0,nodmg:1}});
        const out=y<G.ys[x|0],tk=G.pl.some(q=>q.hp>0&&Math.hypot(q.x-x,G.ys[q.x]-6-y)<16);
        if(out||tk||used>=w.drill)return{path,boom:{x:Math.round(x),y:Math.round(y),r:w.r,dmg:w.dmg}};
      }
      return{path,boom:{x:Math.round(x),y:Math.round(y),r:w.r,dmg:w.dmg}};
    }
    if(hit&&w.pierce){
      if(pen===0)mids.push({k:path.length-1,b:{x:Math.round(x),y:Math.round(y),r:12,dmg:0,nodmg:1}});

$('szsel').innerHTML=SIZES.map(([n,v])=>`<option value="${v}">Size: ${n}</option>`).join('');
$('szsel').onchange=()=>{mapW=+$('szsel').value;broadcastLobby()};
$('budsel').innerHTML=[6,8,10,12,14,16,20,24].map(v=>`<option value="${v}">Budget: ${v} pts</option>`).join('');
$('budsel').onchange=()=>{budget=+$('budsel').value;lobby.forEach(e=>trimLoad(e.load));broadcastLobby()};
$('hpsel').innerHTML=[1,1.5,2,3].map(v=>`<option value="${v}">HP: ${v}x</option>`).join('');
$('hpsel').onchange=()=>{hpSet=+$('hpsel').value;broadcastLobby()};
$('trsel').innerHTML=TERN.map((n,i)=>`<option value="${i}">Terrain: ${n}</option>`).join('');
$('trsel').onchange=()=>{terMode=+$('trsel').value;broadcastLobby()};

$('drawsel').onchange=()=>{drawVal=+$('drawsel').value;if(drawVal)lobby.forEach(e=>e.load.forEach((n,j)=>{if(WEAPONS[j].cost>=5&&n>1)e.load[j]=1}));broadcastLobby()};
$('mapsel').onchange=()=>{mapStyle=+$('mapsel').value;broadcastLobby()};
$('plist').onclick=e=>{const d=e.target.dataset;if(d.d==null)return;
  edit(+d.i,l=>{l.load[+d.w]=Math.max(0,Math.min(drawVal>0&&WEAPONS[+d.w].cost>=5?1:MAXAMMO,l.load[+d.w]+ +d.d))})};
$('plist').onchange=e=>{if(e.target.dataset.k==='trait')edit(+e.target.dataset.i,l=>{l.trait=+e.target.value})};
function newCode(){return Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('')}

function hostLobby(){
  isHost=true;myId='host';code=newCode();
  const name=$('name').value.trim()||'Host';
  peer=new Peer('tankarena-'+code);
  peer.on('open',()=>{const e=mk(name,'host');e.col=myCol;e.hat=myHat;lobby=[e];broadcastLobby()});
  peer.on('error',e=>$('status').textContent='Network error: '+e.type);
  peer.on('connection',c=>{
    conns.push(c);
    c.on('data',d=>{
      if(d.t==='join'){
        if(G||lobby.length>=4){c.send({t:'full'});return}
        lobby.push(Object.assign(mk(String(d.name).slice(0,14),c.peer),{col:PAL[d.col]?d.col|0:null,hat:HATS[d.hat]?d.hat|0:0}));broadcastLobby();
      }else if(d.t==='pick'&&draft){const i=lobby.findIndex(e=>e.owner===c.peer);if(i>=0)setPick(i,d.trait|0)
      }else if(d.t==='setup'&&!G){
        const e=lobby.find(p=>p.owner===c.peer);if(!e||!Array.isArray(d.load))return;
        const load=WEAPONS.map((w,i)=>i?Math.max(0,Math.min(MAXAMMO,d.load[i]|0)):0);
        if(cost(load)>budget||!TRAITS[d.trait])return;
        e.trait=d.trait|0;e.load=load;broadcastLobby();
      }else if(d.t==='aim'&&G&&canActFor(c.peer)){applyAim(d);conns.forEach(o=>{if(o!==c&&o.open)o.send(d)})
      }else if(d.t==='fire'&&G&&canActFor(c.peer))hostFire(+d.angle,Math.min(100,Math.max(0,+d.power)),+d.w,+d.x);
    });
    c.on('close',()=>{conns=conns.filter(x=>x!==c);if(!G){lobby=lobby.filter(p=>p.owner!==c.peer);draft=null;draftData=null;broadcastLobby()}else{dropPlayer(c.peer);broadcast({t:'drop',owner:c.peer})}});
  });
}
const canActFor=o=>G.over===-1&&!G.anim&&G.pl[G.turn].owner===o;

function joinLobby(){
  const c=$('joincode').value.trim().toUpperCase();if(!c)return;
  code=c;peer=new Peer();
  peer.on('error',e=>$('status').textContent='Could not connect: '+e.type);
  peer.on('open',id=>{
    myId=id;hostConn=peer.connect('tankarena-'+c);
    hostConn.on('open',()=>hostConn.send({t:'join',name:$('name').value.trim()||'Player',col:myCol,hat:myHat}));
    hostConn.on('data',d=>{
      if(d.t==='lobby'){G=null;draftData=null;lobby=d.players;mapStyle=d.map;teamMode=!!d.tm;mapW=d.sz||960;budget=d.bud||10;hpSet=d.hm||1;terMode=d.tr||0;drawVal=d.dv||0;traitMode=d.tmo||0;renderLobby()}
      else if(d.t==='start')startGame(d);
      else if(d.t==='shot'&&G)playShot(d);
      else if(d.t==='drop')dropPlayer(d.owner);
      else if(d.t==='skip'&&G)applySkip(d);
      else if(d.t==='aim')applyAim(d);
      else if(d.t==='draft'){draftData=d;renderDraft()}
      else if(d.t==='hn'&&G)G.pl.forEach((p,i)=>p.hn=d.hn[i]);
      else if(d.t==='hand'&&G&&G.pl[d.i]){G.pl[d.i].ammo=d.ammo;if(G.pl[G.turn].ammo[G.weapon]===0)G.weapon=0;renderW()}
      else if(d.t==='full')$('status').textContent='Lobby is full or already started.';
    });
    hostConn.on('close',()=>{alert('Disconnected from host.');location.reload()});
  });
}

$('host').onclick=hostLobby;
$('join').onclick=joinLobby;
$('addlocal').onclick=()=>{if(lobby.length<4){lobby.push(mk('Local '+(lobby.length+1),'host'));broadcastLobby()}};
function rollOffers(){const a=[...TRAITS.keys()].slice(1);for(let i=a.length-1;i>0;i--){const k=Math.random()*(i+1)|0;[a[i],a[k]]=[a[k],a[i]]}return a.slice(0,4)}
function startDraft(){
  draft={offers:lobby.map(e=>e.bot?null:rollOffers()),picks:lobby.map(e=>e.bot?-1:null)};
  sendDraft();
}
function sendDraft(){
  draftData={offers:draft.offers,done:draft.picks.map(x=>x!=null),picks:draft.picks.slice()};
  broadcast({t:'draft',...draftData});renderDraft();checkDraft();
}
function checkDraft(){
  if(draft&&draft.picks.every(x=>x!=null)){
    lobby.forEach((e,i)=>{e.trait=draft.picks[i]>=0?draft.picks[i]:1+(Math.random()*(TRAITS.length-1)|0)});
    draft=null;draftData=null;beginGame();
  }
}
function setPick(i,t){if(!draft||!draft.offers[i]||!draft.offers[i].includes(t))return;draft.picks[i]=t;sendDraft()}
function renderDraft(){
  if(!draftData)return;show('draftscr');
  $('dlist').innerHTML=lobby.map((p,i)=>{
    const off=draftData.offers[i];
    if(!off)return `<div><b>${esc(p.name)}</b> <small>(bot, random trait)</small></div>`;
    if(p.owner!==myId)return `<div><b>${esc(p.name)}</b> <small>${draftData.done[i]?'picked':'choosing...'}</small></div>`;
    return `<div><b>${esc(p.name)}</b><div class="tg">${off.map(k=>`<div class="tc ${draftData.picks[i]===k?'on':''}" data-i="${i}" data-t="${k}"><b>${TRAITS[k].name}</b><br><small>${TRAITS[k].d}</small></div>`).join('')}</div></div>`;
  }).join('');
  $('dauto').hidden=$('dcancel').hidden=!isHost;
}
$('dlist').onclick=e=>{
  const c=e.target.closest('.tc');if(!c)return;
  const i=+c.dataset.i,t=+c.dataset.t;if(!lobby[i]||lobby[i].owner!==myId)return;
  if(isHost)setPick(i,t);else hostConn.send({t:'pick',trait:t});
};
$('dauto').onclick=()=>{if(draft){draft.picks=draft.picks.map((x,i)=>x==null?draft.offers[i][Math.random()*4|0]:x);sendDraft()}};
$('dcancel').onclick=()=>{draft=null;draftData=null;broadcastLobby()};
$('traitsel').innerHTML=['Traits: free choice','Traits: pick 1 of 4 random','Traits: assigned randomly'].map((n,i)=>`<option value="${i}">${n}</option>`).join('');
$('traitsel').onchange=()=>{traitMode=+$('traitsel').value;broadcastLobby()};
$('start').onclick=()=>{
  if(traitMode===1){startDraft();return}
  if(traitMode===2)lobby.forEach(e=>{e.trait=1+(Math.random()*(TRAITS.length-1)|0)});
  beginGame();
};
function beginGame(){
  lobby.forEach(e=>{if(e.bot){if(traitMode===0)e.trait=Math.random()*TRAITS.length|0;e.load=randLoad()}});
  const n=lobby.length,slots=[...Array(n).keys()].map(i=>Math.round(mapW*(i+1)/(n+1)));
  for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[slots[i],slots[j]]=[slots[j],slots[i]]}
  const m={t:'start',seed:Math.random()*1e9|0,turn:0,tm:teamMode,W:mapW,hpm:hpSet,dm:drawVal>0?1:0,map:mapStyle<0?Math.random()*MAPS.length|0:mapStyle,wind:+(Math.random()*2-1).toFixed(2),
           players:lobby.map((p,i)=>({name:p.name,owner:p.owner,x:slots[i],trait:p.trait,load:p.load,col:p.col,hat:p.hat}))};
  broadcast(m);startGame(m);if(G.dm)initDraw();
}
$('addbot').onclick=()=>{if(lobby.length<4){lobby.push(Object.assign(mk('Bot '+(lobby.filter(e=>e.bot).length+1),'bot'),{bot:1,col:null}));broadcastLobby()}};
$('rmlast').onclick=()=>{const e=lobby[lobby.length-1];if(lobby.length>1&&(e.bot||e.owner==='host')){lobby.pop();broadcastLobby()}};
$('resetsc').onclick=()=>{lobby.forEach(e=>e.wins=0);broadcastLobby()};
$('newgame').onclick=()=>{G=null;broadcastLobby()};
$('fire').onclick=fire;$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};$('mvl').onclick=()=>move(-4);$('mvr').onclick=()=>move(4);
$('wbar').onclick=e=>{const i=e.target.dataset.w;if(i!=null)pickW(+i)};
$('copylink').onclick=async()=>{
  const u=location.origin+location.pathname+'?join='+code;
  try{await navigator.clipboard.writeText(u);$('copylink').textContent='Copied!'}catch(e){prompt('Invite link:',u)}
  setTimeout(()=>$('copylink').textContent='Copy invite link',1500);
};
try{$('name').value=localStorage.getItem('ta_name')||'Player'}catch(e){}
$('name').onchange=()=>{try{localStorage.setItem('ta_name',$('name').value)}catch(e){}};
let myCol=0,myHat=0;
try{myCol=+localStorage.getItem('ta_col')||0;myHat=+localStorage.getItem('ta_hat')||0}catch(e){}
function renderCust(){
  $('swatches').innerHTML=PAL.map((c,i)=>`<button class="sw" data-c="${i}" style="background:${c};outline:${i===myCol?'3px solid #fff':'0'}"></button>`).join('');
  $('hatsel').innerHTML=HATS.map((h,i)=>`<option value="${i}" ${i===myHat?'selected':''}>${h}</option>`).join('');
}
const saveCust=()=>{try{localStorage.setItem('ta_col',myCol);localStorage.setItem('ta_hat',myHat)}catch(e){}};
$('swatches').onclick=e=>{if(e.target.dataset.c!=null){myCol=+e.target.dataset.c;saveCust();renderCust()}};
$('hatsel').onchange=()=>{myHat=+$('hatsel').value;saveCust()};
renderCust();
const q=new URLSearchParams(location.search).get('join');if(q)$('joincode').value=q;

/* ---------- input ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
function aimFromPointer(e){
  if(!canAct())return;
  const r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)*960/r.width,sy=(e.clientY-r.top)*540/r.height,mx=cam.x+(sx-480)/cam.z,my=cam.y+(sy-270)/cam.z;
  const p=G.pl[G.turn],dx=mx-p.x,dy=G.ys[p.x]-12-my;
  G.angle=Math.min(180,Math.max(0,Math.atan2(dy,dx)*180/Math.PI));
  G.power=Math.min(100,Math.hypot(dx,dy)/2.5);
}
cv.addEventListener('pointerdown',e=>{if(e.button===0)aimFromPointer(e)});
cv.addEventListener('pointermove',e=>{
  if(e.buttons&6){const r=cv.getBoundingClientRect();cam.x-=e.movementX*(960/r.width)/cam.z;cam.y-=e.movementY*(540/r.height)/cam.z;cam.hold=performance.now()+4000;clampCam()}
  else if(e.buttons&1)aimFromPointer(e);
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});
const zc=f=>{const r=cv.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)};
$('zin').onclick=()=>zc(1.25);$('zout').onclick=()=>zc(.8);
$('zfit').onclick=()=>{cam.z=960/W;cam.hold=0;clampCam()};
addEventListener('keydown',e=>{
  if(!G||document.activeElement.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();fire();return}
  if(e.code==='KeyQ'||e.code==='KeyE'){if(canAct())cycleW(e.code==='KeyE'?1:-1);return}
  if(e.code==='KeyA'){move(-2);return}
  if(e.code==='KeyD'){move(2);return}
  if(/^Digit[1-9]$/.test(e.code)){pickW(+e.code.slice(5)-1);return}
  if(!canAct())return;
  const s=e.shiftKey?5:1;
  if(e.code==='ArrowLeft')G.angle=Math.min(180,G.angle+s);
  if(e.code==='ArrowRight')G.angle=Math.max(0,G.angle-s);
  if(e.code==='ArrowUp')G.power=Math.min(100,G.power+s);
  if(e.code==='ArrowDown')G.power=Math.max(0,G.power-s);
});

/* ---------- rendering ---------- */
function draw(){
  requestAnimationFrame(draw);
  if(!G)return;
  if(G.anim){const A=G.anim,e=Math.floor(A.i+=1.4);
    (A.m.mids||[]).forEach(d=>{if(!d.done&&e>=d.k){d.done=1;applyBoom(d.b)}});
    if(e>=Math.max(...A.m.paths.map(p=>p.length)))finishShot()}
  if(canAct()){const c0=G.pl[G.turn],k=c0.x+'|'+G.angle.toFixed(1)+'|'+G.power.toFixed(0)+'|'+G.weapon;
    if(k!==G.lk&&performance.now()-(G.lt||0)>60){G.lk=k;G.lt=performance.now();sendAim()}}
  if(isHost&&!G.anim&&G.over===-1&&performance.now()-G.t0>TURN_MS)hostSkip();
  else if(isHost&&!G.anim&&G.over===-1&&G.pl[G.turn].owner==='bot'&&performance.now()-G.t0>1300)botTurn();
  ctx.save();if(G.shake>.5){ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);G.shake*=.88}else G.shake=0;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2a4a');g.addColorStop(1,'#6b8bb8');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,1000,580);camUpdate();
  ctx.save();ctx.translate(480,270);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
  ctx.fillStyle='#2a1208';ctx.fillRect(-2000,H,W+4000,2000);ctx.fillRect(-2000,-2000,2000,4000);ctx.fillRect(W,-2000,2000,4000);
  const lg=ctx.createLinearGradient(0,H-45,0,H);lg.addColorStop(0,'#ff7a1a');lg.addColorStop(1,'#a01800');ctx.fillStyle=lg;ctx.fillRect(0,H-40,W,40);
  ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<W;x++)ctx.lineTo(x,G.ys[x]);ctx.lineTo(W,H);ctx.closePath();
  const tg=ctx.createLinearGradient(0,150,0,H);tg.addColorStop(0,'#5b8c3a');tg.addColorStop(.15,'#6b4a2b');tg.addColorStop(1,'#3a2918');
  ctx.fillStyle=tg;ctx.fill();
  const cur=G.pl[G.turn];
  G.pl.forEach((p,i)=>{
    const y=G.ys[p.x];
    if(p.hp<=0){ctx.fillStyle='#555';ctx.fillRect(p.x-12,y-8,24,8);return}
    if(i===G.turn&&G.over===-1){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(p.x,y-48);ctx.lineTo(p.x-6,y-58);ctx.lineTo(p.x+6,y-58);ctx.fill()}
    const a=(i===G.turn&&!G.anim?G.angle:p.lastAngle??(p.x<W/2?55:125))*Math.PI/180;
    ctx.strokeStyle='#222';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x,y-10);ctx.lineTo(p.x+Math.cos(a)*18,y-10-Math.sin(a)*18);ctx.stroke();
    const pc=PAL[p.col??i];ctx.fillStyle=G.tm?COL[p.team]:pc;ctx.fillRect(p.x-12,y-9,24,9);ctx.fillStyle=pc;ctx.beginPath();ctx.arc(p.x,y-9,8,Math.PI,0);ctx.fill();drawHat(ctx,p.x,y-17,p.hat||0);
    ctx.fillStyle='#0008';ctx.fillRect(p.x-16,y-32,32,5);ctx.fillStyle=p.hp/p.maxhp>.4?'#4ade80':'#f87171';ctx.fillRect(p.x-16,y-32,32*Math.min(1,p.hp/p.maxhp),5);
    if(p.shield){ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,y-8,20,0,7);ctx.stroke()}
    ctx.font='11px system-ui';ctx.textAlign='center';if(p.poison>0){ctx.fillStyle='#84cc16';ctx.fillText('☠'+p.poison,p.x+22,y-18)}
    if(G.dm&&p.hn){ctx.fillStyle='#fde68a';ctx.fillText('🃏'+p.hn,p.x-22,y-18)}
    ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(p.name,p.x,y-36);
  });
  const gh=cur.ghost;
  if(gh&&!G.anim&&G.over===-1){
    ctx.save();ctx.setLineDash([3,7]);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.5;
    gh.forEach(P=>{ctx.beginPath();P.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();const e=P[P.length-1];ctx.beginPath();ctx.arc(e[0],e[1],4,0,7);ctx.stroke()});
    ctx.restore();
  }
  if(canAct()){
    const a=G.angle*Math.PI/180,sp=WEAPONS[G.weapon].straight?12:G.power*.16;
    let x=cur.x+Math.cos(a)*16,y=G.ys[cur.x]-12-Math.sin(a)*16,vx=Math.cos(a)*sp,vy=-Math.sin(a)*sp;
    ctx.fillStyle='rgba(255,255,255,.55)';const ww=WEAPONS[G.weapon].nowind?0:G.wind;
    for(let i=0;i<60;i++){vx+=ww*.02;vy+=WEAPONS[G.weapon].straight?0:.12;x+=vx;y+=vy;if(i%4===3){ctx.beginPath();ctx.arc(x,y,1.8,0,7);ctx.fill()}}
  }
  if(G.anim){
    ctx.fillStyle='#fff';
    for(const P of G.anim.m.paths){const e=Math.min(Math.floor(G.anim.i),P.length-1);
      for(let k=Math.max(0,e-6);k<=e;k++){ctx.globalAlpha=.2+.8*(k-e+6)/6;ctx.beginPath();ctx.arc(P[k][0],P[k][1],3,0,7);ctx.fill()}}
    ctx.globalAlpha=1;
  }
  G.fx=G.fx.filter(f=>{f.t++;const k=f.t/18;
    ctx.globalAlpha=Math.max(0,1-k);ctx.fillStyle=f.c||'#ffb347';ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.4+k*.8),0,7);ctx.fill();ctx.globalAlpha=1;
    return f.t<=18});
  G.parts=(G.parts||[]).filter(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.25;q.l--;ctx.fillStyle='#8b6a45';ctx.fillRect(q.x,q.y,3,3);return q.l>0});
  ctx.textAlign='center';ctx.font='bold 16px system-ui';
  G.floats=G.floats.filter(f=>{f.t++;f.y-=.7;ctx.globalAlpha=Math.max(0,1-f.t/80);ctx.fillStyle='#000';ctx.fillText(f.txt,f.x+1,f.y+1);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;return f.t<80});
  ctx.restore();
  ctx.textAlign='left';ctx.font='14px system-ui';
  G.msgs=G.msgs.filter(m=>m.t++<300);
  G.msgs.slice(-4).forEach((m,k)=>{ctx.globalAlpha=Math.min(1,(300-m.t)/60);ctx.fillStyle='#fff';ctx.fillText(m.txt,12,46+k*18);ctx.globalAlpha=1});
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='15px system-ui';
  const w=G.wind;
  ctx.fillText(G.over===-1?`${cur.name}'s turn   ${WEAPONS[G.weapon].name}   Angle ${G.angle.toFixed(0)}°   Power ${WEAPONS[G.weapon].straight?'-':G.power.toFixed(0)}   Fuel ${G.fuel}   Time ${Math.max(0,Math.ceil((TURN_MS-(performance.now()-G.t0))/1000))}`:'',12,22);
  ctx.textAlign='right';ctx.fillText(`Wind ${w<0?'◀':'▶'} ${Math.abs(w*10).toFixed(1)}`,948,22);
  if(G.over!==-1){
    ctx.textAlign='center';ctx.font='bold 40px system-ui';ctx.fillStyle='#fff';
    ctx.fillText(G.over===-2?'Draw!':G.tm?'Team '+TN[G.pl[G.over].team]+' wins!':G.pl[G.over].name+' wins!',480,270);
    ctx.font='15px system-ui';ctx.fillText(isHost?'Press "Back to lobby" to change loadouts and play again':'Waiting for the host...',480,304);
  }
  ctx.restore();
}
draw();
</script></body></html>
